fidelity:
  divergences: The initial local sign algebra generalizes to arbitrary nonzero real inputs
    and excludes triangle boundary equalities. The mixture theorem now constructs an actual
    product-space law and proves its moments and non-Gaussianity from measurable, bounded,
    intrinsically nonconstant V; the source-specific V=v(R) and its hypotheses remain unformalized.
    The prescribed prime-root length fraction and actual contamination moment errors are proved,
    conditionally on abstract input probability laws with the source support. Identifying
    these with the spectral laws remains an external mathematical obligation. The moment bound
    uses the documented relaxation from ((2m-1)/(2 sqrt m))^(2k) to m^k. None of these changes
    the original problem target.
