  description: Partial formalization of supporting blocks in Sidney Holden's non-Gaussian
    nodal-surplus counterexample. Includes local sign algebra, an actual normalized Gaussian
    variance-mixture law with proved moments and non-Gaussianity, and the exact prime-root
    length fraction and actual second/fourth-moment contamination error tending to zero. The
    full spectral reduction, concrete mixing law, and graph-surplus convergence remain unformalized.
