fidelity:
  divergences: The initial sign algebra generalizes to arbitrary nonzero real inputs and excludes
    triangle boundary equalities. The graph block preserves actual parallel-edge identifiers; degrees
    are loopless incidence counts and the Euler result is an integer expression, not a formal homology-dimension
    identification. The mixture theorem constructs an actual product-space law and proves its moments
    and non-Gaussianity. The actual Cauchy-defined variance function now satisfies its hypotheses
    under any full-support real probability law with no atom at zero; construction and verification
    of the source's stable ratio law remain missing. Full joint rational independence of the entire
    prime-root sequence and the exact scaled graph edge family, plus positivity, are now proved.
    The actual graph core/total sums are now identified with the prescribed formulas and the weight
    bound is proved for their actual ratio. Prime-root length weights and actual contamination moment
    errors are proved conditionally on probability laws with the source support. Identifying these
    with spectral laws remains an external mathematical obligation. The moment bound relaxes ((2m-1)/(2
    sqrt m))^(2k) to m^k. None of these changes the original problem target.
