version: v0.4
project:
  name: 'AIM 114: actual graph and independent lengths, variance mixture, and transfer'
  description: Partial formalization of supporting blocks in Sidney Holden's non-Gaussian nodal-surplus
    counterexample. Includes the actual finite multigraph with positive jointly rationally independent
    prescribed edge lengths, local sign algebra, core quadratic-form diagonalization and positive
    index, the actual Cauchy-defined variance function, a normalized Gaussian variance-mixture law
    with proved moments and non-Gaussianity, exact actual-edge sum identities linking the graph to
    the prescribed prime-root weight, and second/fourth-moment contamination error tending to zero.
    The full spectral reduction, stable ratio law, and graph-surplus convergence remain unformalized.
  authors:
  - OpenAI Codex (AI-generated implementation for Sidney Holden)
  license: Apache-2.0
