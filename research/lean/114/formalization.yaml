# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: "AIM 114: supporting sign and moment lemmas"
  description: >-
    Partial formalization of three supporting steps in Sidney Holden's
    non-Gaussian nodal-surplus counterexample: a local edge sign-count identity,
    a four-sign second-moment formula, and an integral kurtosis inequality under
    an explicit positive-variance hypothesis. This does not prove the graph
    counterexample, its limiting law, or either full AIM 114 assertion.
  authors:
    - "OpenAI Codex (AI-generated implementation for Sidney Holden)"
  license: Apache-2.0
repository:
  role: substantive-development
sources:
  - title: "A non-Gaussian limit for nodal surplus, revised proof v0.3"
    authors: [Sidney Holden]
    id: https://github.com/sidneyholden1/AIM/blob/f02e5534d3a21c98171606ef04266f4c6f07dd88/research/solutions/114-nodal-surplus-counterexample/submitted/short_proof-v0.3.pdf
    type: manuscript
    location: "Section 2 local module identity; Section 3 sign average; Section 5 strict moment inequality"
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Authorship was confirmed by the submitting user. The source PDF has no
      author line and is preserved unchanged. User authorization to prepare a
      PR is not reported as endorsement of the final generated Lean code.
      Only the three specified supporting steps are formalized.
  - title: "AIM 114: A universal central limit law for quantum-graph nodal surplus"
    id: https://github.com/MColbrook/AIM/blob/8eff4c7f8516ce38dd5a8aa31d78b6f44b95cf88/problems/114-quantum-graph-nodal-clt.md
    type: web-post
    location: Problem statement
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Context for a partial formalization only. The retained target has two
      universal assertions. The informal submission refutes the Gaussian one;
      the universal variance assertion remains open. Neither is proved or
      refuted by these three Lean declarations alone.
automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        Separate implementing and reviewing AI agents; pinned Lean 4.33.1 and
        Mathlib; independent mathematical-boundary reviews and type-checking
        before proofs; separate Challenge and Solution environments.
      prompting_notes: >-
        Preserve Sidney Holden's mathematical authorship, exact source target,
        and all unformalized links. Do not replace the graph limit theorem by
        its supporting lemmas or treat cited informal theorems as Lean axioms.
  notes: >-
    No human peer review, source-author endorsement of the implementation,
    or unmeasured time/cost claim is made. Pure algebra and integral identities
    use Mathlib proof terms; no numerical interval certificate is needed.
status:
  scope: >-
    Partial supporting results only. Full spectral and probabilistic links are
    inventoried in NUMERICAL_TARGETS.md. Local macOS Lean 4.33.1 builds, fresh
    proof re-elaboration, and transitive axiom checks passed, including separate
    runs by both final proof referees. Authoritative isolated Linux verification
    is pending. The catalogue must not be promoted to Lean verified on this
    package's basis even if these three supporting declarations pass that check.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: AIM.P114.module_count_identity
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: AIM.P114.sign_second_moment
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: AIM.P114.variance_mixture_kurtosis
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []
fidelity:
  divergences: >-
    The local algebra is generalized to arbitrary nonzero real inputs.
    nonzeroSign takes value +1 at zero, but all relevant arguments are proved
    nonzero under the theorem hypotheses. The deterministic four-sign average
    excludes triangle boundary equalities and does not assert their nullity.
    The moment inequality uses actual integrals on a probability space, but
    assumes positive mean and variance and does not construct the graph's
    mixing law. This is deliberately incomplete coverage of the original target.
review:
  status: "agent-reviewed; local-build-accepted; isolated-Linux-verification-pending"
  reviewers:
    - "OpenAI Codex AI agent /root/spectral_review: independent statement and final proof referee 1"
    - "OpenAI Codex AI agent /root/probability_review: independent statement and final proof referee 2"
  notes: >-
    The reports bind exact Definitions, Challenge and NUMERICAL_TARGETS hashes.
    Both approvals and successful boundary type-checking preceded proof
    implementation. The three deliberate Challenge placeholders are excluded
    from proof-development sorry counts; Solution must not import Challenge.
    Both independent final referees inspected the actual proofs, re-elaborated
    Proof, built Solution, and printed the exact transitive axiom sets. Their
    reports bind the final source hashes. These macOS runs are not represented
    as authoritative Linux Comparator or isolated raw-kernel replay.
alignment:
  - source: "Manuscript Section 2, three module sign counts minus one pivot"
    declarations: [AIM.P114.module_count_identity]
  - source: "Manuscript Section 3, conditional second-moment finite sign average"
    declarations: [AIM.P114.sign_second_moment]
  - source: "Manuscript Section 5, strict kurtosis inequality for the mixing variance"
    declarations: [AIM.P114.variance_mixture_kurtosis]
acknowledgements: >-
  Mathematical manuscript by Sidney Holden. Formalization generated with OpenAI
  Codex. Mathlib, Lean, LeanCert, Lean Comparator, and the AIM/NLA verification
  infrastructure retain their respective attribution and licenses. The local
  Apache-2.0 license covers the new formalization files, not the submitted PDF.
toolchain:
  lean: leanprover/lean4:v4.33.1
  leancert: 621a43d7cf21f87872392a01e874f2f1dbddc926
  mathlib: 0df444a360eaa60ab8c11dca51a86af692955474
  dependency_manifest: lake-manifest.json
